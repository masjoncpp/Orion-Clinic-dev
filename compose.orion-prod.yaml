# =============================================================================
# Orion Clinic — compose untuk DISTRIBUSI (image sudah jadi)
# Cara pakai:
#   1. Ganti Dockerfile lama dengan Dockerfile.orion-optimized (nama tetap
#      "Dockerfile"), dan tambahkan `target: dev` di compose.yaml lama supaya
#      alur dev-mu tidak berubah.
#   2. Build + publish image sekali (butuh login ke GHCR):
#        docker build -t ghcr.io/masjoncpp/orion-clinic:latest --target runtime .
#        docker push ghcr.io/masjoncpp/orion-clinic:latest
#   3. Orang lain tinggal:
#        docker compose -f compose.orion-prod.yaml pull
#        docker compose -f compose.orion-prod.yaml up -d
#      tanpa perlu build (tanpa download base image + compile ekstensi),
#      dan tanpa clone repo — kode aplikasi sudah ada di dalam image.
#
# Bedanya dengan compose.yaml (dev):
#   - app memakai image yang sudah jadi (build hanya sebagai fallback),
#     TANPA bind mount `.:/var/www/html` — kode datang dari image.
#   - writable/ dan public/uploads/ memakai named volume supaya sesi, log,
#     dan file upload tidak hilang saat container dibuat ulang.
#   - Tidak ada volume vendor_data (vendor sudah ada di dalam image).
# File .env tetap dibaca dari folder yang sama untuk variabel ${...}.
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ghcr.io/masjoncpp/orion-clinic:latest
    container_name: orionclinic-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      app.baseURL: ${APP_BASE_URL:-http://localhost:8080/}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-orionclinic}
      DB_USERNAME: ${DB_USERNAME:-orionclinic}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      database.default.hostname: ${DB_HOST:-db}
      database.default.database: ${DB_DATABASE:-orionclinic}
      database.default.username: ${DB_USERNAME:-orionclinic}
      database.default.password: ${DB_PASSWORD:-change_me}
      database.default.DBDriver: MySQLi
      database.default.port: ${DB_PORT:-3306}
      database.tests.hostname: ${DB_HOST:-db}
      database.tests.database: ${DB_DATABASE:-orionclinic}
      database.tests.username: ${DB_USERNAME:-orionclinic}
      database.tests.password: ${DB_PASSWORD:-change_me}
      database.tests.DBDriver: MySQLi
      database.tests.port: ${DB_PORT:-3306}
    volumes:
      - writable_data:/var/www/html/writable
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - orion-net

  db:
    image: mariadb:10.11
    container_name: orionclinic-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me}
      MARIADB_DATABASE: ${DB_DATABASE:-orionclinic}
      MARIADB_USER: ${DB_USERNAME:-orionclinic}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change_me}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./orionclinic.sql:/docker-entrypoint-initdb.d/01-orionclinic.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - orion-net

volumes:
  db_data:
  writable_data:
  uploads_data:

networks:
  orion-net:
    driver: bridge
